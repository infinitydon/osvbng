apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: osvbng-cpe-access
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "host-device",
      "device": {{ .Values.subscriberLab.accessHostDevice | quote }}
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: genieacs-management
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": {{ .Values.genieacs.network.parent | quote }},
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [{"address": {{ .Values.genieacs.network.address | quote }}}],
        "routes": [{"dst": {{ .Values.genieacs.network.cgnatPrefix | quote }}, "gw": {{ .Values.genieacs.network.cgnatGateway | quote }}}]
      }
    }
