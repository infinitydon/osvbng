agentgateway:
  enabled: true
  controller:
    replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

toolhive-operator:
  enabled: true
  operator:
    features:
      experimental: false
      server: true
      registry: false
      virtualMCP: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

open-webui:
  enabled: true
  fullnameOverride: osvbng-open-webui
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "0.11.0"
    pullPolicy: IfNotPresent
  ollama:
    enabled: false
  pipelines:
    enabled: false
  replicaCount: 1
  persistence:
    enabled: true
    size: 2Gi
    storageClass: microk8s-hostpath
  service:
    type: NodePort
    nodePort: 30081
  enableOpenaiApi: true
  openaiBaseApiUrl: http://osvbng-mcp-gateway/v1
  openaiApiKeyExistingSecret: osvbng-agent-client-key
  openaiApiKeyExistingSecretKey: agent-runtime
  extraEnvVars:
    - name: WEBUI_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: osvbng-open-webui-secret
          key: WEBUI_SECRET_KEY
  commonEnvVars:
    - name: WEBUI_NAME
      value: OSVBNG AIOps
    - name: OPENAI_API_CONFIGS
      value: '{"0":{"enable":true,"prefix_id":"","model_ids":["qwen3.5:cloud","gpt-oss:120b-cloud"]}}'
    - name: DEFAULT_MODELS
      value: osvbng-operations-ollama-cloud
    - name: DEFAULT_PINNED_MODELS
      value: osvbng-operations-ollama-cloud,gpt-oss:120b-cloud
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

openWebUIBootstrap:
  enabled: true
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "0.11.0"
    pullPolicy: IfNotPresent
  baseUrl: http://osvbng-open-webui
  timeoutSeconds: 300
  credentials:
    adminSecret: osvbng-open-webui-admin
    nocSecret: osvbng-open-webui-noc
  group:
    nocName: OSVBNG NOC
    nocDescription: Read-only OSVBNG NOC operations
  models:
    baseModel: qwen3.5:cloud
    noc:
      id: osvbng-noc-ollama-cloud
      name: qwen3.5:cloud - OSVBNG NOC Operations
      systemPrompt: >-
        You are the read-only OSVBNG NOC operations assistant. Use only attached
        live NOC MCP tools for operational claims. Never claim that a tool was
        called unless a tool result was returned. You cannot retrieve raw or
        complete configurations, create or delete UE sessions, perform HA
        switchover, change network state, or use administrator or Kubernetes
        administration tools. When a request requires any unavailable or
        disallowed capability, do not call or invent a tool, do not disclose
        cached details, and do not suggest CLI, API, configuration, or other
        bypass instructions. Respond only with: 'This request is denied for the
        NOC role because it requires administrator authorization. No action was
        taken and no protected data was accessed. Contact an OSVBNG administrator
        if operationally required.'
    admin:
      id: osvbng-operations-ollama-cloud
      name: qwen3.5:cloud - OSVBNG Admin Operations
  connections:
    noc:
      id: osvbng-operations-noc
      name: OSVBNG NOC Operations
      url: http://osvbng-mcp-gateway/mcp/noc
      secretName: osvbng-mcp-noc-client-key
      secretKey: api-key
    admin:
      id: osvbng-operations-admin
      name: OSVBNG Admin Operations
      url: http://osvbng-mcp-gateway/mcp/admin
      secretName: osvbng-mcp-admin-client-key
      secretKey: api-key
    kubernetes:
      id: kubernetes-operations
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

osvbngMcp:
  enabled: true
  serviceAccountName: osvbng-ops-mcp
  image: ghcr.io/infinitydon/osvbng-mcp:0.2.12@sha256:4eca66d47d36202b99119688f59cf9ef4835a7aa73ca16fd69cde8d476832d8c
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-pull
  bngNamespace: osvbng-ha
  frrReleaseName: osvbng-frr-isp
  frrContainer: frr
  releaseName: osvbng
  memberCount: 2
  requestTimeoutSeconds: 10
  ueApiUrl: http://ue-test-api.osvbng-ha.svc.cluster.local:8081
  ueRequestTimeoutSeconds: 60
  profiles:
    noc:
      enabled: true
      serverName: osvbng-ops-noc
      path: /mcp/noc
      # Keep /mcp as the least-privilege default for existing clients.
      legacyPath: /mcp
      allowMutations: false
      allowUeMutations: false
      clientAuth:
        enabled: true
        secretName: osvbng-mcp-noc-client-key
      tools:
        - bng_health
        - ha_status
        - ha_sync
        - subscriber_sessions
        - cgnat_pools
        - cgnat_mappings
        - cgnat_sessions
        - radius_servers
        - bng_bgp_status
        - bng_routes
        - bng_bgp_routes
        - bng_vpp_routes
        - frr_bgp_status
        - frr_routes
        - frr_bgp_routes
        - frr_neighbor_routes
        - routing_overview
        - ue_sessions
        - ue_session_range
        - ue_session_status
        - ue_ping
        - ue_curl
    admin:
      enabled: true
      serverName: osvbng-ops-admin
      path: /mcp/admin
      allowMutations: true
      allowUeMutations: true
      clientAuth:
        enabled: true
        secretName: osvbng-mcp-admin-client-key
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

kubernetesMcp:
  enabled: true
  serverName: kubernetes-ops
  image: quay.io/containers/kubernetes_mcp_server:v0.0.65@sha256:5df586e2c7ced2a3125f6e78923388d80b69de0a2ad1470325b05318f12725bd
  pullPolicy: IfNotPresent
  serviceAccountName: kubernetes-ops-mcp
  readOnly: true
  # Allow inventory and diagnostics across all namespaces while server-side
  # deniedResources continues to block Secrets and ServiceAccounts.
  clusterWideReadOnly: true
  # Increment when the embedded operational guidance changes so ToolHive rolls the pod.
  guidanceVersion: "1"
  toolsets:
    - core
  targetNamespaces:
    - osvbng-aiops
    - osvbng-ha
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  enabled: true
  name: osvbng-mcp-gateway
  serviceType: NodePort
  port: 80
  nodePort: 30080

ollamaCloud:
  enabled: true
  backendName: ollama-cloud
  host: ollama.com
  port: 443
  path: /v1/chat/completions
  model: ""
  upstreamSecret:
    name: ollama-cloud-api-key
    key: OLLAMA_CLOUD_API_KEY
  clientAuth:
    enabled: true
    secretName: osvbng-agent-client-key
