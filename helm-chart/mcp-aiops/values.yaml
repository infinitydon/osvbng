agentgateway:
  enabled: true
  controller:
    replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

toolhive-operator:
  enabled: true
  operator:
    features:
      experimental: false
      server: true
      registry: false
      virtualMCP: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

open-webui:
  enabled: true
  fullnameOverride: osvbng-open-webui
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "0.11.0"
    pullPolicy: IfNotPresent
  ollama:
    enabled: false
  pipelines:
    enabled: false
  replicaCount: 1
  persistence:
    enabled: true
    size: 2Gi
    storageClass: microk8s-hostpath
  service:
    type: NodePort
    nodePort: 30081
  enableOpenaiApi: true
  openaiBaseApiUrl: http://osvbng-mcp-gateway/v1
  openaiApiKeyExistingSecret: osvbng-agent-client-key
  openaiApiKeyExistingSecretKey: agent-runtime
  extraEnvVars:
    - name: WEBUI_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: osvbng-open-webui-secret
          key: WEBUI_SECRET_KEY
  commonEnvVars:
    - name: WEBUI_NAME
      value: OSVBNG AIOps
    - name: OPENAI_API_CONFIGS
      value: '{"0":{"enable":true,"prefix_id":"","model_ids":["qwen3.5:cloud","gpt-oss:120b-cloud"]}}'
    - name: DEFAULT_MODELS
      value: osvbng-operations-ollama-cloud
    - name: DEFAULT_PINNED_MODELS
      value: osvbng-operations-ollama-cloud,gpt-oss:120b-cloud
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

osvbngMcp:
  enabled: true
  serverName: osvbng-ops
  image: ghcr.io/infinitydon/osvbng-mcp:0.2.7@sha256:aa5aafcd46f37f0a52c4f8c6ef1c37a1fa985ceb048fdfb5b2d890c8382aca04
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-pull
  bngNamespace: osvbng-ha
  releaseName: osvbng
  memberCount: 2
  requestTimeoutSeconds: 10
  allowMutations: false
  ueApiUrl: http://ue-test-api.osvbng-ha.svc.cluster.local:8081
  ueRequestTimeoutSeconds: 60
  allowUeMutations: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

kubernetesMcp:
  enabled: true
  serverName: kubernetes-ops
  image: quay.io/containers/kubernetes_mcp_server:v0.0.65@sha256:5df586e2c7ced2a3125f6e78923388d80b69de0a2ad1470325b05318f12725bd
  pullPolicy: IfNotPresent
  serviceAccountName: kubernetes-ops-mcp
  readOnly: true
  # Allow inventory and diagnostics across all namespaces while server-side
  # deniedResources continues to block Secrets and ServiceAccounts.
  clusterWideReadOnly: true
  # Increment when the embedded operational guidance changes so ToolHive rolls the pod.
  guidanceVersion: "1"
  toolsets:
    - core
  targetNamespaces:
    - osvbng-aiops
    - osvbng-ha
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  enabled: true
  name: osvbng-mcp-gateway
  serviceType: NodePort
  port: 80
  nodePort: 30080

ollamaCloud:
  enabled: true
  backendName: ollama-cloud
  host: ollama.com
  port: 443
  path: /v1/chat/completions
  model: ""
  upstreamSecret:
    name: ollama-cloud-api-key
    key: OLLAMA_CLOUD_API_KEY
  clientAuth:
    enabled: true
    secretName: osvbng-agent-client-key
