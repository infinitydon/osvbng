agentgateway:
  enabled: true
  controller:
    replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

toolhive-operator:
  enabled: true
  operator:
    features:
      experimental: false
      server: true
      registry: false
      virtualMCP: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

osvbngMcp:
  enabled: true
  serverName: osvbng-ops
  image: ghcr.io/infinitydon/osvbng-mcp:0.1.1@sha256:bb82d21a13fef828a893fe9caa3d19502a01d9e463de937c54c81e67af6d3130
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  bngNamespace: osvbng-ha
  releaseName: osvbng
  memberCount: 2
  requestTimeoutSeconds: 10
  allowMutations: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  enabled: true
  name: osvbng-mcp-gateway
  serviceType: NodePort
  port: 80
  nodePort: 30080
