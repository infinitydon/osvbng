agentgateway:
  enabled: true
  controller:
    replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

toolhive-operator:
  enabled: true
  operator:
    features:
      experimental: false
      server: true
      registry: false
      virtualMCP: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

open-webui:
  enabled: true
  fullnameOverride: osvbng-open-webui
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "0.11.0"
    pullPolicy: IfNotPresent
  ollama:
    enabled: false
  pipelines:
    enabled: false
  replicaCount: 1
  persistence:
    enabled: true
    size: 2Gi
    storageClass: microk8s-hostpath
  service:
    type: NodePort
    nodePort: 30081
  enableOpenaiApi: true
  openaiBaseApiUrl: http://osvbng-mcp-gateway/v1
  openaiApiKeyExistingSecret: osvbng-agent-client-key
  openaiApiKeyExistingSecretKey: agent-runtime
  extraEnvVars:
    - name: WEBUI_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: osvbng-open-webui-secret
          key: WEBUI_SECRET_KEY
  commonEnvVars:
    - name: WEBUI_NAME
      value: OSVBNG AIOps
    - name: OPENAI_API_CONFIGS
      value: '{"0":{"enable":true,"prefix_id":"","model_ids":["gpt-oss:20b","gpt-oss:120b"]}}'
    - name: DEFAULT_MODELS
      value: osvbng-operations-ollama-cloud
    - name: DEFAULT_PINNED_MODELS
      value: osvbng-operations-ollama-cloud,gpt-oss:120b
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

osvbngMcp:
  enabled: true
  serverName: osvbng-ops
  image: ghcr.io/infinitydon/osvbng-mcp:0.2.1@sha256:783b84d98ec7eb16736663bf4a4f0030ecc3cb3603d9a5e15635d89dba3a55fd
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-pull
  bngNamespace: osvbng-ha
  releaseName: osvbng
  memberCount: 2
  requestTimeoutSeconds: 10
  allowMutations: false
  ueApiUrl: http://ue-test-api.osvbng-ha.svc.cluster.local:8081
  ueRequestTimeoutSeconds: 60
  allowUeMutations: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  enabled: true
  name: osvbng-mcp-gateway
  serviceType: NodePort
  port: 80
  nodePort: 30080

ollamaCloud:
  enabled: true
  backendName: ollama-cloud
  host: ollama.com
  port: 443
  path: /v1/chat/completions
  model: ""
  upstreamSecret:
    name: ollama-cloud-api-key
    key: OLLAMA_CLOUD_API_KEY
  clientAuth:
    enabled: true
    secretName: osvbng-agent-client-key
