{{- if .Values.osvbngMcp.enabled }}
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ .Values.osvbngMcp.serverName }}
spec:
  image: {{ .Values.osvbngMcp.image | quote }}
  {{- with .Values.osvbngMcp.imagePullSecrets }}
  podTemplateSpec:
    spec:
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      containers:
        - name: mcp
          imagePullPolicy: {{ $.Values.osvbngMcp.pullPolicy }}
  {{- end }}
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  env:
    - name: OSVBNG_NAMESPACE
      value: {{ .Values.osvbngMcp.bngNamespace | quote }}
    - name: OSVBNG_RELEASE
      value: {{ .Values.osvbngMcp.releaseName | quote }}
    - name: OSVBNG_MEMBER_COUNT
      value: {{ .Values.osvbngMcp.memberCount | quote }}
    - name: OSVBNG_TIMEOUT
      value: {{ .Values.osvbngMcp.requestTimeoutSeconds | quote }}
    - name: OSVBNG_ALLOW_MUTATIONS
      value: {{ .Values.osvbngMcp.allowMutations | quote }}
  resources:
    {{- toYaml .Values.osvbngMcp.resources | nindent 4 }}
{{- end }}
