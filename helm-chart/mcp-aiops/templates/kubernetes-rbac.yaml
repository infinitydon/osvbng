{{- if .Values.kubernetesMcp.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.kubernetesMcp.serverName }}-config
data:
  config.toml: |
    read_only = {{ .Values.kubernetesMcp.readOnly }}
    toolsets = {{ toJson .Values.kubernetesMcp.toolsets }}
    server_instructions = """
    Use this server for live Kubernetes state only. Never infer a workload kind or
    name from a pod name. To identify a pod's controller, get the pod and inspect
    metadata.ownerReferences. If its owner is a ReplicaSet, get that ReplicaSet and
    inspect its metadata.ownerReferences to find the Deployment. Report every link
    in the observed owner chain and the exact final kind/name. StatefulSets normally
    own their pods directly; a ReplicaSet is not a StatefulSet or Deployment.
    """

    [tool_overrides.pods_get]
    description = "Get a pod by exact name and namespace. For controller questions, inspect metadata.ownerReferences; do not infer ownership from the pod name. If the owner is a ReplicaSet, call resources_get for that ReplicaSet to find its owning Deployment."

    [tool_overrides.resources_get]
    description = "Get a Kubernetes resource by group, version, kind, name, and namespace. Use this to traverse metadata.ownerReferences exactly. For a pod owned by a ReplicaSet, retrieve apps/v1 ReplicaSet and inspect its ownerReferences before reporting the Deployment."

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "ServiceAccount"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.kubernetesMcp.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
---
{{- range $namespace := .Values.kubernetesMcp.targetNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Values.kubernetesMcp.serviceAccountName }}-reader
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io", "gateway.networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Values.kubernetesMcp.serviceAccountName }}-reader
  namespace: {{ $namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.kubernetesMcp.serviceAccountName }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Values.kubernetesMcp.serviceAccountName }}-reader
---
{{- end }}
{{- end }}
