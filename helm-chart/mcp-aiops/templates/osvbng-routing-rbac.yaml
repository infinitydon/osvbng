{{- if .Values.osvbngMcp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.osvbngMcp.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.osvbngMcp.serviceAccountName }}-routing-reader
  namespace: {{ .Values.osvbngMcp.bngNamespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Kubernetes models exec as a create operation. The MCP implementation
  # exposes only fixed, validated read-only FRR/VPP show commands.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.osvbngMcp.serviceAccountName }}-routing-reader
  namespace: {{ .Values.osvbngMcp.bngNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.osvbngMcp.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.osvbngMcp.serviceAccountName }}-routing-reader
{{- end }}
