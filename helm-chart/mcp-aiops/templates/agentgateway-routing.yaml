{{- if and .Values.gateway.enabled .Values.osvbngMcp.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ .Values.gateway.name }}
  listeners:
    - name: mcp
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ .Values.gateway.name }}
spec:
  service:
    spec:
      type: {{ .Values.gateway.serviceType }}
      {{- if and (eq .Values.gateway.serviceType "NodePort") .Values.gateway.nodePort }}
      ports:
        - name: listener-{{ .Values.gateway.port }}
          port: {{ .Values.gateway.port }}
          targetPort: {{ .Values.gateway.port }}
          nodePort: {{ .Values.gateway.nodePort }}
      {{- end }}
{{- $root := . }}
{{- range $profileName, $profile := .Values.osvbngMcp.profiles }}
{{- if $profile.enabled }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: osvbng-mcp-{{ $profileName }}
spec:
  mcp:
    targets:
      - name: osvbng-{{ $profileName }}
        static:
          backendRef:
            name: mcp-{{ $profile.serverName }}-proxy
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osvbng-mcp-{{ $profileName }}
spec:
  parentRefs:
    - name: {{ $root.Values.gateway.name }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $profile.path }}
        {{- with $profile.legacyPath }}
        - path:
            type: Exact
            value: {{ . }}
        {{- end }}
      backendRefs:
        - name: osvbng-mcp-{{ $profileName }}
          group: agentgateway.dev
          kind: AgentgatewayBackend
{{- if $profile.clientAuth.enabled }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: osvbng-mcp-{{ $profileName }}-client-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: osvbng-mcp-{{ $profileName }}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: {{ $profile.clientAuth.secretName }}
      location:
        header:
          name: Authorization
          prefix: "Bearer "
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.kubernetesMcp.enabled }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kubernetes-mcp
spec:
  mcp:
    targets:
      - name: kubernetes
        static:
          backendRef:
            name: mcp-{{ .Values.kubernetesMcp.serverName }}-proxy
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-mcp
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /kubernetes/mcp
      backendRefs:
        - name: kubernetes-mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
{{- end }}
{{- end }}
