{{- if and .Values.gateway.enabled .Values.ollamaCloud.enabled }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ .Values.ollamaCloud.backendName }}
spec:
  ai:
    provider:
      {{- if .Values.ollamaCloud.model }}
      openai:
        model: {{ .Values.ollamaCloud.model | quote }}
      {{- else }}
      openai: {}
      {{- end }}
      host: {{ .Values.ollamaCloud.host }}
      port: {{ .Values.ollamaCloud.port }}
  policies:
    auth:
      secretRef:
        name: {{ .Values.ollamaCloud.upstreamSecret.name }}
        key: {{ .Values.ollamaCloud.upstreamSecret.key }}
    tls:
      sni: {{ .Values.ollamaCloud.host }}
    ai:
      routes:
        "/v1/chat/completions": Completions
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.ollamaCloud.backendName }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ .Values.ollamaCloud.path }}
      backendRefs:
        - name: {{ .Values.ollamaCloud.backendName }}
          group: agentgateway.dev
          kind: AgentgatewayBackend
{{- if .Values.ollamaCloud.clientAuth.enabled }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ .Values.ollamaCloud.backendName }}-client-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.ollamaCloud.backendName }}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: {{ .Values.ollamaCloud.clientAuth.secretName }}
{{- end }}
{{- end }}
