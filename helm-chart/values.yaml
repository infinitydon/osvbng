osvbng:
  # v0.2.0 plus upstream commit 3cea1c7, which adds the omitted VPP DPDK package.
  image: "ghcr.io/infinitydon/osvbng:v0.2.0-dpdk.1@sha256:5f6c50606e6d69cd1d07b5f249128889638796192cae677b27a3f5018ae620bf"
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  privileged: true
  serviceType: ClusterIP
  ports:
    grpc: 50050
    prometheus: 9090
    http: 8080
  mountSysKernelDebug: true
  shmSize: "2Gi"
  resources:
    cpu: "6"
    memory: "6Gi"
    hugepages1Gi: "2Gi"
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-01
  dpdk:
    enabled: true
    # Direct host VFIO access. Kubernetes does not arbitrate these devices;
    # keep one osvbng replica pinned to their dedicated worker.
    vfioHostPath: /dev/vfio
    # Dedicated VirtIO VFIO devices on the VLAN-capable worker.
    pciAddresses:
      - "0000:09:03.0"
      - "0000:09:04.0"
    accessPci: "0000:09:03.0"
    corePci: "0000:09:04.0"
    rxQueues: 2
    txQueues: 2
    socketMemory: "1024"

bngblaster:
  enabled: true
  image: "ghcr.io/infinitydon/bngblaster:0.9.37-1@sha256:428d1ddb243fc99676e69a92f5eb60b2cbe2818250ff1bf4e8290d52255827d2"
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  accessInterface: "net1"
  coreInterface: "net2"
  sessions: 100
  startRate: 20
  stopRate: 20
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-01
  resources:
    requests:
      cpu: "1"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "1Gi"

multus:
  enabled: true
  bngblaster:
    devices:
      accessHostDevice: "enp8s21"
      coreHostDevice: "enp8s22"
