{{- $root := . -}}
{{- range $i, $member := .Values.members }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ printf "%s-core-%s" (include "frr.fullname" $root) $member.name }}
spec:
  config: |
    {"cniVersion":"0.3.1","type":"macvlan","master":{{ $root.Values.macvlan.parent | quote }},"mode":"bridge","ipam":{"type":"static","addresses":[{"address":{{ $member.core.address | quote }}}]}}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ printf "%s-uplink-%s" (include "frr.fullname" $root) $member.name }}
spec:
  config: |
    {"cniVersion":"0.3.1","type":"macvlan","master":{{ $root.Values.macvlan.parent | quote }},"mode":"bridge","ipam":{"type":"static","addresses":[{"address":{{ $member.uplink.address | quote }}}]}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" (include "frr.fullname" $root) $member.name }}
data:
  daemons: |
    zebra=yes
    staticd=yes
    bgpd={{ ternary "yes" "no" $root.Values.bgp.enabled }}
    bfdd={{ ternary "yes" "no" (and $root.Values.bgp.enabled $root.Values.bgp.bfd) }}
    vrrpd=no
  vtysh.conf: |
    service integrated-vtysh-config
  frr.conf: |
    frr version 10.7
    frr defaults traditional
    hostname frr-isp-{{ $member.name }}
    service integrated-vtysh-config
    log stdout informational
    ip forwarding
    {{- if not $root.Values.upstream.bgp.enabled }}
    ip route 0.0.0.0/0 {{ $root.Values.upstream.gateway }} 10
    {{- end }}
    {{- if $root.Values.bgp.enabled }}
    {{- if $root.Values.upstream.bgp.enabled }}
    ip prefix-list MIKROTIK-IN seq 10 permit 0.0.0.0/0
    ip prefix-list MIKROTIK-OUT seq 10 permit {{ $root.Values.cgnat.prefix }}
    route-map MIKROTIK-IN permit 10
     match ip address prefix-list MIKROTIK-IN
    route-map MIKROTIK-IN deny 100
    route-map MIKROTIK-OUT permit 10
     match ip address prefix-list MIKROTIK-OUT
    route-map MIKROTIK-OUT deny 100
    {{- end }}
    router bgp {{ $root.Values.bgp.localAs }}
     bgp router-id {{ regexReplaceAll "/.*" $member.core.address "" }}
     no bgp ebgp-requires-policy
     no bgp default ipv4-unicast
    {{- range $neighbor := $root.Values.bgp.bngNeighbors }}
     neighbor {{ $neighbor.address }} remote-as {{ $root.Values.bgp.peerAs }}
     neighbor {{ $neighbor.address }} description {{ $neighbor.description }}
     {{- if $root.Values.bgp.bfd }}
     neighbor {{ $neighbor.address }} bfd
     {{- end }}
    {{- end }}
    {{- if $root.Values.upstream.bgp.enabled }}
     neighbor {{ $root.Values.upstream.bgp.neighbor }} remote-as {{ $root.Values.upstream.bgp.peerAs }}
     neighbor {{ $root.Values.upstream.bgp.neighbor }} description MikroTik-Upstream
     {{- if $root.Values.upstream.bgp.bfd }}
     neighbor {{ $root.Values.upstream.bgp.neighbor }} bfd
     {{- end }}
    {{- end }}
     address-family ipv4 unicast
    {{- range $neighbor := $root.Values.bgp.bngNeighbors }}
      neighbor {{ $neighbor.address }} activate
    {{- end }}
    {{- if $root.Values.upstream.bgp.enabled }}
      neighbor {{ $root.Values.upstream.bgp.neighbor }} activate
      neighbor {{ $root.Values.upstream.bgp.neighbor }} route-map MIKROTIK-IN in
      neighbor {{ $root.Values.upstream.bgp.neighbor }} route-map MIKROTIK-OUT out
    {{- end }}
     exit-address-family
    {{- else }}
    ip route {{ $root.Values.cgnat.prefix }} {{ required "cgnat.staticNextHop is required when BGP is disabled" $root.Values.cgnat.staticNextHop }} 20
    {{- end }}
  keepalived.conf: |
    global_defs {
      router_id FRR_ISP_{{ upper $member.name }}
      enable_script_security
    }
    vrrp_instance OSVBNG_ISP {
      state BACKUP
      interface core
      virtual_router_id 51
      priority {{ $member.priority }}
      advert_int 1
      unicast_src_ip {{ regexReplaceAll "/.*" $member.core.address "" }}
      unicast_peer {
        {{ $member.peerCoreAddress }}
      }
      virtual_ipaddress {
        {{ $root.Values.ha.coreVip }} dev core
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "frr.fullname" $root) $member.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "frr.fullname" $root }}
      app.kubernetes.io/component: router
      app.kubernetes.io/instance: {{ $member.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "frr.fullname" $root }}
        app.kubernetes.io/component: router
        app.kubernetes.io/instance: {{ $member.name }}
      annotations:
        checksum/config: {{ dict "member" $member "bgp" $root.Values.bgp "cgnat" $root.Values.cgnat "upstream" $root.Values.upstream "ha" $root.Values.ha | toJson | sha256sum }}
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":{{ printf "%s-core-%s" (include "frr.fullname" $root) $member.name | quote }},"interface":"core"},
           {"name":{{ printf "%s-uplink-%s" (include "frr.fullname" $root) $member.name | quote }},"interface":"uplink"}]
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                {{- range $key, $value := $root.Values.nodeAffinity.matchLabels }}
                  - key: {{ $key }}
                    operator: In
                    values:
                      - {{ $value | quote }}
                {{- end }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "frr.fullname" $root }}
                  app.kubernetes.io/component: router
              topologyKey: kubernetes.io/hostname
      hostNetwork: false
      initContainers:
        - name: network-setup
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}@{{ $root.Values.image.digest }}"
          securityContext:
            privileged: true
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ip link set core up
              ip link set uplink up
              sysctl -w net.ipv4.ip_forward=1
              sysctl -w net.ipv4.conf.all.rp_filter=0
              sysctl -w net.ipv4.conf.core.rp_filter=0
              sysctl -w net.ipv4.conf.uplink.rp_filter=0
              sysctl -w net.ipv4.conf.all.send_redirects=0
              sysctl -w net.ipv4.conf.core.send_redirects=0
              sysctl -w net.ipv4.conf.uplink.send_redirects=0
              sysctl -w net.ipv4.conf.uplink.proxy_arp=1
              ip route del default 2>/dev/null || true
              {{- if not $root.Values.upstream.bgp.enabled }}
              ip route replace default via {{ $root.Values.upstream.gateway }} dev uplink metric 10
              {{- end }}
              ip route replace {{ $root.Values.clusterServiceCidr }} via 169.254.1.1 dev eth0
      containers:
        - name: frr
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}@{{ $root.Values.image.digest }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            privileged: true
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/frr
        {{- if $root.Values.ha.enabled }}
        - name: keepalived
          image: {{ $root.Values.ha.keepalivedImage }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "NET_BROADCAST"]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache keepalived
              exec keepalived --dont-fork --log-console --use-file=/etc/frr/keepalived.conf
          volumeMounts:
            - name: config
              mountPath: /etc/frr
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-%s" (include "frr.fullname" $root) $member.name }}
{{- end }}
