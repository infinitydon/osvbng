{{- $root := . -}}
{{- range $i, $member := .Values.members }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ printf "%s-core-%s" (include "frr.fullname" $root) $member.name }}
spec:
  config: |
    {"cniVersion":"0.3.1","type":"macvlan","master":{{ $member.core.parent | quote }},"mode":"bridge","ipam":{"type":"static","addresses":[{"address":{{ $member.core.address | quote }}}]}}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ printf "%s-uplink-%s" (include "frr.fullname" $root) $member.name }}
spec:
  config: |
    {"cniVersion":"0.3.1","type":"macvlan","master":{{ $member.uplink.parent | quote }},"mode":"bridge","ipam":{"type":"static","addresses":[{"address":{{ $member.uplink.address | quote }}}]}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" (include "frr.fullname" $root) $member.name }}
data:
  daemons: |
    zebra=yes
    staticd=yes
    vrrpd=no
  vtysh.conf: |
    service integrated-vtysh-config
  frr.conf: |
    frr version 10.7
    frr defaults traditional
    hostname frr-isp-{{ $member.name }}
    service integrated-vtysh-config
    log stdout informational
    ip forwarding
    ip route 0.0.0.0/0 {{ $root.Values.upstream.gateway }} 10
    ip route {{ $root.Values.cgnat.prefix }} {{ (index $root.Values.bng.members 0).address }} 20
  keepalived.conf: |
    global_defs {
      router_id FRR_ISP_{{ upper $member.name }}
      enable_script_security
    }
    vrrp_instance OSVBNG_ISP {
      state BACKUP
      interface core
      virtual_router_id 51
      priority {{ $member.priority }}
      advert_int 1
      unicast_src_ip {{ regexReplaceAll "/.*" $member.core.address "" }}
      unicast_peer {
        {{ $member.peerCoreAddress }}
      }
      virtual_ipaddress {
        {{ $root.Values.ha.coreVip }} dev core
        {{ $root.Values.ha.uplinkVip }} dev uplink
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-parent-%s" (include "frr.fullname" $root) $member.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "frr.fullname" $root }}
      app.kubernetes.io/component: parent-link
      app.kubernetes.io/instance: {{ $member.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "frr.fullname" $root }}
        app.kubernetes.io/component: parent-link
        app.kubernetes.io/instance: {{ $member.name }}
    spec:
      nodeName: {{ $member.nodeName }}
      hostNetwork: true
      containers:
        - name: parent-link
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}@{{ $root.Values.image.digest }}"
          securityContext:
            privileged: true
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ip link set {{ $member.core.parent }} up
              ip link set {{ $member.uplink.parent }} up
              exec sleep infinity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "frr.fullname" $root) $member.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "frr.fullname" $root }}
      app.kubernetes.io/component: router
      app.kubernetes.io/instance: {{ $member.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "frr.fullname" $root }}
        app.kubernetes.io/component: router
        app.kubernetes.io/instance: {{ $member.name }}
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          [{"name":{{ printf "%s-core-%s" (include "frr.fullname" $root) $member.name | quote }},"interface":"core"},
           {"name":{{ printf "%s-uplink-%s" (include "frr.fullname" $root) $member.name | quote }},"interface":"uplink"}]
    spec:
      nodeName: {{ $member.nodeName }}
      hostNetwork: false
      initContainers:
        - name: network-setup
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}@{{ $root.Values.image.digest }}"
          securityContext:
            privileged: true
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ip link set core up
              ip link set uplink up
              sysctl -w net.ipv4.ip_forward=1
              sysctl -w net.ipv4.conf.all.rp_filter=0
              sysctl -w net.ipv4.conf.core.rp_filter=0
              sysctl -w net.ipv4.conf.uplink.rp_filter=0
              sysctl -w net.ipv4.conf.uplink.proxy_arp=1
              ip route del default 2>/dev/null || true
              ip route replace default via {{ $root.Values.upstream.gateway }} dev uplink metric 10
              ip route replace {{ $root.Values.clusterServiceCidr }} via 169.254.1.1 dev eth0
      containers:
        - name: frr
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}@{{ $root.Values.image.digest }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            privileged: true
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/frr
        - name: active-bng-route
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}@{{ $root.Values.image.digest }}"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              while true; do
                {{- range $bng := $root.Values.bng.members }}
                if wget -qO- --timeout=2 {{ $bng.api }}/api/show/ha/status | grep -q '"state":"ACTIVE"'; then
                  ip route replace {{ $root.Values.cgnat.prefix }} via {{ $bng.address }} dev core metric 20
                fi
                {{- end }}
                sleep 2
              done
        {{- if $root.Values.ha.enabled }}
        - name: keepalived
          image: {{ $root.Values.ha.keepalivedImage }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "NET_BROADCAST"]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache keepalived
              exec keepalived --dont-fork --log-console --use-file=/etc/frr/keepalived.conf
          volumeMounts:
            - name: config
              mountPath: /etc/frr
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-%s" (include "frr.fullname" $root) $member.name }}
{{- end }}
