# Apply this file to the sibling BNG chart when using the default FRR profile.
osvbng:
  core:
    nextHop: 172.31.255.1
  bgp:
    enabled: true
    localAs: 65010
    peerAs: 65020
    cgnatPrefix: 192.168.88.12/30
    bfd: false
    pollIntervalSeconds: 2
    neighbors:
      - name: frr-a
        address: 172.31.255.4
      - name: frr-b
        address: 172.31.255.5
  cgnat:
    proxyArp: false
    outsideAddresses:
      - 192.168.88.12
      - 192.168.88.13
      - 192.168.88.14
      - 192.168.88.15
  ha:
    members:
      - nodeId: bng-a
        coreAddress: 172.31.255.2/29
        priority: 100
        preempt: false
      - nodeId: bng-b
        coreAddress: 172.31.255.3/29
        priority: 90
        preempt: false
    srg:
      interfaces:
        - access
      networks:
        - prefix: 10.255.0.0/24
        - prefix: 192.168.88.12/30
