{{- if .Values.bngblaster.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: bngblaster-validation
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.bngblaster.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: bngblaster
      {{- if .Values.multus.enabled }}
      annotations:
        k8s.v1.cni.cncf.io/networks: bngblaster-access, bngblaster-core
        checksum/config: {{ include (print $.Template.BasePath "/bngblaster-config.yaml") . | sha256sum }}
      {{- else }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/bngblaster-config.yaml") . | sha256sum }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- with .Values.bngblaster.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.bngblaster.nodeSelector | nindent 8 }}
      initContainers:
        - name: disable-ipv6
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              # Disable IPv6 on Multus interfaces
              sysctl -w net.ipv6.conf.{{ .Values.bngblaster.accessInterface | quote }}.disable_ipv6=1
              sysctl -w net.ipv6.conf.{{ .Values.bngblaster.coreInterface | quote }}.disable_ipv6=1
              echo "IPv6 disabled on net1 and net2"
          securityContext:
            privileged: true
      containers:
        - name: bngblaster
          image: {{ .Values.bngblaster.image | quote }}
          imagePullPolicy: {{ .Values.bngblaster.pullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              bngblaster \
                -C /config-templates/multiple-multi-qinq.json \
                -S /run/bngblaster.sock \
                -L /tmp/bngblaster.log \
                -l info -l dhcp &
              BBL_PID=$!
              trap 'kill -TERM "$BBL_PID" 2>/dev/null || true' EXIT
              while kill -0 "$BBL_PID" 2>/dev/null; do
                ACKS=$(grep -c "DHCP-ACK received" /tmp/bngblaster.log 2>/dev/null || true)
                echo "BNG Blaster validation: ${ACKS}/{{ .Values.bngblaster.sessions }} sessions established"
                if [ "$ACKS" -ge {{ .Values.bngblaster.sessions }} ]; then
                  echo "PASS: {{ .Values.bngblaster.sessions }} subscriber sessions established"
                  kill -TERM "$BBL_PID" 2>/dev/null || true
                  wait "$BBL_PID" || true
                  trap - EXIT
                  exit 0
                fi
                sleep {{ .Values.bngblaster.pollIntervalSeconds }}
              done
              wait "$BBL_PID"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            {{- toYaml .Values.bngblaster.resources | nindent 12 }}
          volumeMounts:
            - name: bngblaster-config
              mountPath: /config-templates
      volumes:
        - name: bngblaster-config
          configMap:
            name: bngblaster-config
{{- end }}
