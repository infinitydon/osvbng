apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: osvbng
spec:
  serviceName: osvbng
  replicas: 1
  selector:
    matchLabels:
      app: osvbng
  template:
    metadata:
      labels:
        app: osvbng
      annotations:
        checksum/entrypoint: {{ include (print $.Template.BasePath "/osvbng-entrypoint-cm.yaml") . | sha256sum }}
        checksum/osvbng-config: {{ include (print $.Template.BasePath "/osvbngconf.yaml") . | sha256sum }}
        checksum/dataplane-config: {{ include (print $.Template.BasePath "/dataplane-conf.yaml") . | sha256sum }}
        checksum/frr-config: {{ include (print $.Template.BasePath "/frr-conf.yaml") . | sha256sum }}
    spec:
      {{- with .Values.osvbng.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.osvbng.nodeSelector | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: osvbng
          image: {{ .Values.osvbng.image | quote }}
          imagePullPolicy: {{ .Values.osvbng.pullPolicy }}
          command: ["/scripts/docker-entrypoint.sh"]
          resources:
            requests:
              memory: {{ .Values.osvbng.resources.memory }}
              cpu: {{ .Values.osvbng.resources.cpu }}
              hugepages-1Gi: {{ .Values.osvbng.resources.hugepages1Gi }}
            limits:
              memory: {{ .Values.osvbng.resources.memory }}
              cpu: {{ .Values.osvbng.resources.cpu }}
              hugepages-1Gi: {{ .Values.osvbng.resources.hugepages1Gi }}
          securityContext:
            privileged: {{ .Values.osvbng.privileged }}
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                - IPC_LOCK
                - SYS_NICE
                - SYS_RAWIO
          env:
          - name: OSVBNG_ACCESS_PCI
            value: {{ .Values.osvbng.dpdk.accessPci | quote }}
          - name: OSVBNG_CORE_PCI
            value: {{ .Values.osvbng.dpdk.corePci | quote }}
          - name: OSVBNG_DPDK_RX_QUEUES
            value: {{ .Values.osvbng.dpdk.rxQueues | quote }}
          - name: OSVBNG_DPDK_TX_QUEUES
            value: {{ .Values.osvbng.dpdk.txQueues | quote }}
          - name: OSVBNG_DPDK_SOCKET_MEMORY
            value: {{ .Values.osvbng.dpdk.socketMemory | quote }}
          - name: OSVBNG_CORE_ADDRESS
            value: {{ .Values.osvbng.core.address | quote }}
          - name: OSVBNG_CORE_NEXT_HOP
            value: {{ .Values.osvbng.core.nextHop | quote }}
          - name: OSVBNG_INSTALL_DEFAULT_ROUTE
            value: {{ .Values.osvbng.core.installDefaultRoute | quote }}
          ports:
          - name: grpc
            containerPort: {{ .Values.osvbng.ports.grpc }}
          - name: prometheus
            containerPort: {{ .Values.osvbng.ports.prometheus }}
          - name: http
            containerPort: {{ .Values.osvbng.ports.http }}
          startupProbe:
            exec:
              command: ["vppctl", "-s", "/run/osvbng/cli.sock", "show", "version"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["vppctl", "-s", "/run/osvbng/cli.sock", "show", "version"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
          - name: entrypoint-script
            mountPath: /scripts
          # Mount FRR configs to staging directory instead of /etc/frr directly
          - name: frr-config
            mountPath: /frr-config-templates
            readOnly: true
          - name: config-templates
            mountPath: /config-templates
          - name: hugepages
            mountPath: /dev/hugepages
          - name: config-versions
            mountPath: /var/lib/osvbng/config-versions
          {{- if .Values.osvbng.mountSysKernelDebug }}
          - name: sys-kernel-debug
            mountPath: /sys/kernel/debug
            readOnly: true
          {{- end }}
          - name: dshm
            mountPath: /dev/shm
          - name: tun
            mountPath: /dev/net/tun
          {{- if .Values.osvbng.dpdk.enabled }}
          - name: vfio
            mountPath: /dev/vfio
          {{- end }}
      volumes:
      - name: entrypoint-script
        configMap:
          name: osvbng-entrypoint
          defaultMode: 0755
      - name: frr-config
        configMap:
          name: frr-config
      - name: config-templates
        projected:
          sources:
          - configMap:
              name: osvbng-dataplane-template
          - configMap:
              name: osvbng-config-template
      - name: config-versions
        emptyDir: {}
      {{- if .Values.osvbng.mountSysKernelDebug }}
      - name: sys-kernel-debug
        hostPath:
          path: /sys/kernel/debug
          type: Directory
      {{- end }}
      - name: hugepages
        emptyDir:
          medium: HugePages
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.osvbng.shmSize }}
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      {{- if .Values.osvbng.dpdk.enabled }}
      - name: vfio
        hostPath:
          path: {{ .Values.osvbng.dpdk.vfioHostPath }}
          type: Directory
      {{- end }}
