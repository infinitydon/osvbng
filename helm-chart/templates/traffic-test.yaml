{{- if and .Values.trafficTest.enabled .Values.bngblaster.enabled }}
{{- fail "trafficTest.enabled and bngblaster.enabled are mutually exclusive: host-device CNI cannot assign the same NIC to both pods" }}
{{- end }}
{{- if .Values.trafficTest.enabled }}
{{- if not .Values.multus.enabled }}
{{- fail "trafficTest.enabled requires multus.enabled" }}
{{- end }}
{{- if not .Values.osvbng.cgnat.enabled }}
{{- fail "trafficTest.enabled requires osvbng.cgnat.enabled so subscriber traffic is translated before reaching the lab edge" }}
{{- end }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ue-test-access
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "host-device",
      "device": {{ .Values.multus.trafficTest.devices.accessHostDevice | quote }}
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ue-test-core
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "host-device",
      "device": {{ .Values.multus.trafficTest.devices.coreHostDevice | quote }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ue-test
  template:
    metadata:
      labels:
        app: ue-test
      annotations:
        k8s.v1.cni.cncf.io/networks: ue-test-access
        checksum/ue-vlan-config: {{ printf "%v:%v:%v" .Values.trafficTest.outerVlanProtocol .Values.trafficTest.outerVlan .Values.trafficTest.innerVlan | sha256sum }}
    spec:
      {{- with .Values.trafficTest.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.trafficTest.nodeSelector | nindent 8 }}
      containers:
        - name: session
          image: {{ .Values.trafficTest.bngblasterImage | quote }}
          imagePullPolicy: {{ .Values.trafficTest.pullPolicy }}
          command: ["bngblaster"]
          args:
            - "-C"
            - "/config/ue.json"
            - "-S"
            - "/run/shared/bngblaster.sock"
            - "-L"
            - "/tmp/bngblaster.log"
            - "-l"
            - "info"
            - "-l"
            - "dhcp"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            {{- toYaml .Values.trafficTest.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tun
              mountPath: /dev/net/tun
            - name: runtime
              mountPath: /run/shared
        - name: ue
          image: {{ .Values.trafficTest.image | quote }}
          imagePullPolicy: {{ .Values.trafficTest.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until ip link show bbl1 >/dev/null 2>&1; do sleep 1; done
              until SESSION_JSON=$(printf '%s\n' \
                '{"command":"session-info","arguments":{"session-id":1}}' |
                nc -U /run/shared/bngblaster.sock) &&
                [ "$(printf '%s' "$SESSION_JSON" | jq -r '.["session-info"]["dhcp-state"]')" = "Bound" ]; do
                sleep 1
              done
              SUBSCRIBER_IP=$(printf '%s' "$SESSION_JSON" |
                jq -r '.["session-info"]["ipv4-address"]')
              ip link set bbl1 up
              ip route replace table 100 default dev bbl1
              ip rule add from "$SUBSCRIBER_IP/32" table 100 2>/dev/null || true
              echo "Interactive UE ready on bbl1:"
              ip -4 address show dev bbl1
              ip route
              exec sleep infinity
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            {{- toYaml .Values.trafficTest.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - ip -4 address show dev bbl1 | grep -q 'inet '
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: runtime
              mountPath: /run/shared
      volumes:
        - name: config
          configMap:
            name: ue-test-config
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: runtime
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue-test-upstream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ue-test-upstream
  template:
    metadata:
      labels:
        app: ue-test-upstream
      annotations:
        k8s.v1.cni.cncf.io/networks: ue-test-core
    spec:
      nodeSelector:
        {{- toYaml .Values.trafficTest.nodeSelector | nindent 8 }}
      containers:
        - name: gateway
          image: {{ .Values.trafficTest.image | quote }}
          imagePullPolicy: {{ .Values.trafficTest.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ip link set {{ .Values.trafficTest.coreInterface }} up
              ip address add {{ .Values.trafficTest.coreAddress }} dev {{ .Values.trafficTest.coreInterface }}
              ip route add {{ .Values.osvbng.cgnat.outsideNetwork }} \
                via {{ .Values.trafficTest.bngCoreAddress }} dev {{ .Values.trafficTest.coreInterface }}
              sysctl -w net.ipv4.ip_forward=1
              iptables -t nat -A POSTROUTING \
                -s {{ .Values.osvbng.cgnat.outsideNetwork }} -o eth0 -j MASQUERADE
              iptables -A FORWARD -s {{ .Values.osvbng.cgnat.outsideNetwork }} -j ACCEPT
              iptables -A FORWARD -d {{ .Values.osvbng.cgnat.outsideNetwork }} \
                -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              exec sleep infinity
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.trafficTest.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - ping -c 1 -W 1 {{ .Values.trafficTest.bngCoreAddress }}
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ue-test-config
data:
  ue.json: |
    {
      "interfaces": {
        "tun-name": "bbl",
        "access": [
          {
            "interface": "net1",
            "type": "ipoe",
            "vlan-mode": "1:1",
            "qinq": {{ eq .Values.trafficTest.outerVlanProtocol "802.1ad" }},
            "outer-vlan": {{ .Values.trafficTest.outerVlan }},
            "inner-vlan": {{ .Values.trafficTest.innerVlan }},
            "tun": true
          }
        ]
      },
      "sessions": {
        "count": 1,
        "max-outstanding": 1,
        "start-rate": 1,
        "autostart": true
      },
      "dhcp": {
        "enable": true
      },
      "dhcpv6": {
        "enable": false
      },
      "ipoe": {
        "ipv6": false
      },
      "access-line": {
        "agent-circuit-id": "ue-test",
        "agent-remote-id": "k8s-ue"
      }
    }
{{- end }}
