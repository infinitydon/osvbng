{{- if .Values.bngblaster.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bngblaster
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bngblaster
  template:
    metadata:
      labels:
        app: bngblaster
      {{- if .Values.multus.enabled }}
      annotations:
        k8s.v1.cni.cncf.io/networks: bngblaster-access, bngblaster-core
      {{- end }}
    spec:
      {{- with .Values.bngblaster.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.bngblaster.nodeSelector | nindent 8 }}
      initContainers:
        - name: disable-ipv6
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              # Disable IPv6 on Multus interfaces
              sysctl -w net.ipv6.conf.{{ .Values.bngblaster.accessInterface | quote }}.disable_ipv6=1
              sysctl -w net.ipv6.conf.{{ .Values.bngblaster.coreInterface | quote }}.disable_ipv6=1
              echo "IPv6 disabled on net1 and net2"
          securityContext:
            privileged: true
      containers:
        - name: bngblaster
          image: {{ .Values.bngblaster.image | quote }}
          imagePullPolicy: {{ .Values.bngblaster.pullPolicy }}
          command: ["bngblaster"]
          args:
            - "-C"
            - "/config-templates/multiple-multi-qinq.json"
            - "-S"
            - "/run/bngblaster.sock"
            - "-L"
            - "/tmp/bngblaster.log"
            - "-l"
            - "info"
            - "-l"
            - "dhcp"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            {{- toYaml .Values.bngblaster.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -S /run/bngblaster.sock"]
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: bngblaster-config
              mountPath: /config-templates
      volumes:
        - name: bngblaster-config
          configMap:
            name: bngblaster-config
{{- end }}
