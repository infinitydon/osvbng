{{- if and .Values.trafficTest.enabled .Values.bngblaster.enabled }}
{{- fail "trafficTest.enabled and bngblaster.enabled are mutually exclusive: host-device CNI cannot assign the same NIC to both pods" }}
{{- end }}
{{- if .Values.trafficTest.enabled }}
{{- if not .Values.multus.enabled }}
{{- fail "trafficTest.enabled requires multus.enabled" }}
{{- end }}
{{- if not .Values.osvbng.cgnat.enabled }}
{{- fail "trafficTest.enabled requires osvbng.cgnat.enabled so subscriber traffic is translated before reaching the lab edge" }}
{{- end }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ue-test-access
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "host-device",
      "device": {{ .Values.multus.trafficTest.devices.accessHostDevice | quote }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ue-test
  template:
    metadata:
      labels:
        app: ue-test
      annotations:
        k8s.v1.cni.cncf.io/networks: ue-test-access
        checksum/ue-vlan-config: {{ printf "%v:%v:%v:%v" .Values.trafficTest.outerVlanProtocol .Values.trafficTest.outerVlan .Values.trafficTest.innerVlan .Values.trafficTest.sessionCapacity | sha256sum }}
        checksum/osvbng-subscriber-config: {{ include (print $.Template.BasePath "/osvbngconf.yaml") . | sha256sum }}
    spec:
      {{- with .Values.trafficTest.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.trafficTest.nodeSelector | nindent 8 }}
      containers:
        - name: session
          image: {{ .Values.trafficTest.bngblasterImage | quote }}
          imagePullPolicy: {{ .Values.trafficTest.pullPolicy }}
          command: ["bngblaster"]
          args:
            - "-C"
            - "/config/ue.json"
            - "-S"
            - "/run/shared/bngblaster.sock"
            - "-L"
            - "/tmp/bngblaster.log"
            - "-l"
            - "info"
            - "-l"
            - "dhcp"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            {{- toYaml .Values.trafficTest.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tun
              mountPath: /dev/net/tun
            - name: runtime
              mountPath: /run/shared
        - name: ue
          image: {{ .Values.trafficTest.image | quote }}
          imagePullPolicy: {{ .Values.trafficTest.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              exec sleep infinity
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            {{- toYaml .Values.trafficTest.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -S /run/shared/bngblaster.sock
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: runtime
              mountPath: /run/shared
        - name: ue-api
          image: {{ .Values.trafficTest.apiImage | quote }}
          imagePullPolicy: {{ .Values.trafficTest.pullPolicy }}
          env:
            - name: BNGBLASTER_SOCKET
              value: /run/shared/bngblaster.sock
            - name: UE_SESSION_CAPACITY
              value: {{ .Values.trafficTest.sessionCapacity | quote }}
            - name: UE_SESSION_TIMEOUT
              value: {{ .Values.trafficTest.sessionTimeoutSeconds | quote }}
            - name: UE_API_PORT
              value: {{ .Values.trafficTest.apiPort | quote }}
          ports:
            - name: api
              containerPort: {{ .Values.trafficTest.apiPort }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.trafficTest.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /run/shared
      volumes:
        - name: config
          configMap:
            name: ue-test-config
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ue-test-config
data:
  ue.json: |
    {
      "interfaces": {
        "tun-name": "bbl",
        "access": [
          {
            "interface": "net1",
            "type": "ipoe",
            "vlan-mode": "1:1",
            "qinq": {{ eq .Values.trafficTest.outerVlanProtocol "802.1ad" }},
            "outer-vlan": {{ .Values.trafficTest.outerVlan }},
            "inner-vlan-min": {{ .Values.trafficTest.innerVlan }},
            "inner-vlan-max": {{ add (int .Values.trafficTest.innerVlan) (sub (int .Values.trafficTest.sessionCapacity) 1) }},
            "tun": true
          }
        ]
      },
      "sessions": {
        "count": {{ .Values.trafficTest.sessionCapacity }},
        "max-outstanding": {{ .Values.trafficTest.sessionCapacity }},
        "start-rate": {{ .Values.trafficTest.startRate }},
        "stop-rate": {{ .Values.trafficTest.stopRate }},
        "autostart": false
      },
      "dhcp": {
        "enable": true
      },
      "dhcpv6": {
        "enable": false
      },
      "ipoe": {
        "ipv6": false
      },
      "access-line": {
        "agent-circuit-id": "ue-test",
        "agent-remote-id": "k8s-ue"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ue-test-api
spec:
  selector:
    app: ue-test
  ports:
    - name: http
      port: {{ .Values.trafficTest.apiPort }}
      targetPort: api
{{- end }}
