{{- if .Values.bngblaster.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bngblaster-config
data:
  multiple-multi-qinq.json: |
    {
      "interfaces": {
        "access": [
          {
            "interface": {{ .Values.bngblaster.accessInterface | quote }},
            "type": "ipoe",
            "vlan-mode": "1:1",
            "outer-vlan-min": 100,
            "outer-vlan-max": 100,
            "inner-vlan-min": 100,
            "inner-vlan-max": {{ add 99 .Values.bngblaster.sessions }}
          }
        ]
      },
      "sessions": {
        "count": {{ .Values.bngblaster.sessions }},
        "max-outstanding": {{ .Values.bngblaster.sessions }},
        "start-rate": {{ .Values.bngblaster.startRate }},
        "stop-rate": {{ .Values.bngblaster.stopRate }},
        "autostart": true
      },
      "dhcp": {
        "enable": true
      },
      "dhcpv6": {
        "enable": false
      },
      "ipoe": {
        "ipv6": false
      },
      "access-line": {
        "agent-circuit-id": "eth 0/1/2/3/{session-global}:100.{session-global}",
        "agent-remote-id": "DSLAM-{session-global}"
      }
    }
  multiple-shared-svlan.json: |
    {
      "interfaces": {
        "access": [
          {
            "interface": {{ .Values.bngblaster.accessInterface | quote }},
            "type": "ipoe",
            "vlan-mode": "N:1",
            "outer-vlan-min": 100,
            "outer-vlan-max": 100
          }
        ]
      },
      "sessions": {
        "count": {{ .Values.bngblaster.sessions }},
        "autostart": true,
        "start-rate": {{ .Values.bngblaster.startRate }},
        "stop-rate": {{ .Values.bngblaster.stopRate }},
        "max-outstanding": {{ .Values.bngblaster.sessions }}
      },
      "dhcp": {
        "enable": true
      },
      "dhcpv6": {
        "enable": false
      },
      "ipoe": {
        "ipv6": false
      },
      "access-line": {
        "agent-circuit-id": "eth 0/1/2/3/{session-global}:100.{session-global}",
        "agent-remote-id": "DSLAM-{session-global}"
      },
      "session-traffic": {
        "ipv4-pps": 100
      }
    }  
{{- end }}
