osvbng:
  image: "docker.io/veesixnetworks/osvbng:v0.16.0@sha256:d343e3e6f1bec38e011cda569fc799ab99927aee189e6a7dd45c073a5a462782"
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  privileged: true
  serviceType: ClusterIP
  ports:
    grpc: 50050
    ha: 50051
    prometheus: 9090
    http: 8080
  mountSysKernelDebug: true
  shmSize: "2Gi"
  resources:
    cpu: "6"
    memory: "6Gi"
    hugepages1Gi: "2Gi"
  nodeAffinity:
    matchLabels:
      osvbng.infinitydon.com/bng-frr-ha: "true"
  standalone:
    coreAddress: "192.168.88.10/24"
  core:
    nextHop: "192.168.88.1"
    installDefaultRoute: true
  bgp:
    enabled: false
    localAs: 65010
    peerAs: 65020
    neighbors: []
    cgnatPrefix: ""
    bfd: true
    pollIntervalSeconds: 2
  cgnat:
    enabled: true
    policy: residential
    outsideInterface: core
    # Answer ARP for same-subnet CGNAT addresses on the outside interface.
    # Disable this when the upstream router has explicit routes to the pool.
    proxyArp: true
    insideNetwork: 10.255.0.0/24
    outsideAddresses:
      - 192.168.88.11
      - 192.168.88.12
      - 192.168.88.13
      - 192.168.88.14
      - 192.168.88.15
    blockSize: 512
    maxBlocksPerSubscriber: 2
    maxSessionsPerSubscriber: 2000
  ha:
    enabled: false
    listenAddress: "0.0.0.0:50051"
    # Addresses are explicit and tied to StatefulSet identity, not calculated.
    members:
      - nodeId: bng-a
        coreAddress: 192.168.88.10/24
        priority: 100
        preempt: false
      - nodeId: bng-b
        coreAddress: 192.168.88.11/24
        priority: 90
        preempt: false
    heartbeat:
      interval: 1s
      timeout: 5s
    sync:
      backlogSize: 10000
      pageSize: 1000
      bulkSyncTimeout: 60s
    srg:
      name: default
      virtualMac: "02:00:5e:00:01:01"
      subscriberGroups:
        - default
      interfaces:
        - access
      trackPriorityDecrement: 60
      networks: []
  dpdk:
    enabled: true
    # Allocated by the standalone SR-IOV Network Device Plugin prerequisite.
    resourceName: qemu-virtio-dpdk.dev/osvbng_vfio
    rxQueues: 2
    txQueues: 2
    socketMemory: "1024"

bngblaster:
  enabled: true
  image: "ghcr.io/infinitydon/bngblaster:0.9.37-1@sha256:428d1ddb243fc99676e69a92f5eb60b2cbe2818250ff1bf4e8290d52255827d2"
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  accessInterface: "net1"
  coreInterface: "net2"
  sessions: 20
  startRate: 20
  stopRate: 20
  activeDeadlineSeconds: 300
  pollIntervalSeconds: 2
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-01
  resources:
    requests:
      cpu: "1"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "1Gi"

trafficTest:
  # Interactive UE and upstream gateway mode. This is mutually exclusive
  # with BNG Blaster because host-device CNI moves each NIC into one pod.
  enabled: false
  image: "nicolaka/netshoot:v0.13@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b"
  bngblasterImage: "ghcr.io/infinitydon/bngblaster:0.9.37-1@sha256:428d1ddb243fc99676e69a92f5eb60b2cbe2818250ff1bf4e8290d52255827d2"
  apiImage: "ghcr.io/infinitydon/osvbng-ue-api:0.1.7@sha256:a979303412bf1aca473c2b899319eaef8e1eea7a60a7d93f0e178f30b7362f89"
  apiPort: 8081
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  sessionCapacity: 20
  sessionTimeoutSeconds: 30
  startRate: 5
  stopRate: 5
  outerVlan: 100
  outerVlanProtocol: 802.1Q
  innerVlan: 100
  subscriberNetwork: 10.255.0.0/24
  nodeSelector:
    kubernetes.io/hostname: ebpf-bng-node-01
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

multus:
  enabled: true
  bngblaster:
    devices:
      accessHostDevice: "enp8s21"
      coreHostDevice: "enp8s22"
  trafficTest:
    devices:
      accessHostDevice: "enp8s21"

# Optional subscriber AAA profile. When disabled, osvbng uses its local
# allow-all provider and no FreeRADIUS or PostgreSQL resources are rendered.
radius:
  enabled: false
  autoProvisionTrafficTestUsers: true
  existingSecret: ""
  sharedSecretKey: shared-secret
  clientNetwork: 10.1.0.0/16
  image: "freeradius/freeradius-server:3.2.7@sha256:42b05de4405b1e745686b9ed0f70307fd43e998b850b3e6bd936733a8c260595"
  pullPolicy: IfNotPresent
  authPort: 1812
  accountingPort: 1813
  interimInterval: 60
  ipoePassword: secret
  bootstrapUsers: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  postgresql:
    image: "postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394"
    pullPolicy: IfNotPresent
    passwordKey: postgres-password
    database: radius
    username: radius
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
