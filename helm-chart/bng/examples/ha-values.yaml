osvbng:
  core:
    installDefaultRoute: false
  bgp:
    enabled: true
    localAs: 65010
    peerAs: 65020
    cgnatPrefix: 100.64.100.0/24
    bfd: false
    neighbors:
      - name: frr-a
        address: 172.31.255.4
      - name: frr-b
        address: 172.31.255.5
  cgnat:
    proxyArp: false
    outsideAddresses:
      - 100.64.100.0/24
  ha:
    enabled: true
    members:
      - nodeId: bng-a
        coreAddress: 172.31.255.2/29
        priority: 100
        preempt: false
      - nodeId: bng-b
        coreAddress: 172.31.255.3/29
        priority: 90
        preempt: false
    srg:
      interfaces:
        - access
      networks:
        - prefix: 10.255.0.0/24
        - prefix: 100.64.100.0/24

bngblaster:
  enabled: false
  sessions: 20

trafficTest:
  enabled: true
  sessionCapacity: 20
  imagePullSecrets:
    - name: ghcr-pull

radius:
  enabled: true
  existingSecret: osvbng-radius
  autoProvisionTrafficTestUsers: true
